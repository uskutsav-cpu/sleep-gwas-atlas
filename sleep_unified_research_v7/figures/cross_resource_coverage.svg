<text x="70" y="687" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#48515d" font-weight="normal" text-anchor="start">No exact source/estimand match was established. Thirty HGA bibliographic candidates are E because release and estimand compatibility remain unresolved.</text>
<text x="70" y="715" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#48515d" font-weight="normal" text-anchor="start">Single-snapshot counts are eligible core/extension rows without A/B/E in that comparator. *The union count is 361 match-absent rows across all four snapshots.</text>
<text x="70" y="743" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#48515d" font-weight="normal" text-anchor="start">Fan&#x27;s complete SD11 table was joined by source row reference; no Fan rg/SE/P/FDR values are redistributed. SleepChart is carried forward as audited context only.</text>
<text x="70" y="771" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#48515d" font-weight="normal" text-anchor="start">D denotes release/table-scope absence. CTG-VL had no direct export. No new GWAS, LDSC estimate, or biological evidence was generated.</text>
