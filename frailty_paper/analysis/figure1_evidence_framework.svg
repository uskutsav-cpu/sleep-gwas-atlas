<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500">
<rect width="2000" height="1500" fill="#F5F7FA"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#182230}.title{font-size:32px;font-weight:700}.subtitle{font-size:17px;fill:#475467}.badge{font-size:14px;font-weight:700;letter-spacing:.7px;fill:#8A4B08}.panel{fill:#FFFFFF;stroke:#D9E0E8;stroke-width:1.5}.panel-title{font-size:21px;font-weight:700}.panel-sub{font-size:14px;fill:#667085}.card{fill:#F8FAFC;stroke:#CFD8E3;stroke-width:1.2}.blue{fill:#EAF3F7;stroke:#7AA7B8}.teal{fill:#EAF4F1;stroke:#7BAF9F}.amber{fill:#FFF5E8;stroke:#DBA45B}.gray{fill:#F0F2F5;stroke:#B8C0CA}.small{font-size:14px;fill:#475467}.body{font-size:16px}.card-title{font-size:17px;font-weight:700}.count{font-size:26px;font-weight:700;fill:#145C72}.count-amber{font-size:26px;font-weight:700;fill:#9A5A12}.arrow{stroke:#667085;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#667085"/></marker></defs>
<text x="44" y="54" class="title" text-anchor="start">Study framework and current evidence status</text>
<text x="44" y="84" class="subtitle" text-anchor="start">Sleep and circadian phenotypes × frailty definitions × aging context</text>
<rect x="1530" y="34" width="425" height="36" rx="18" class="amber"/>
<text x="1742" y="58" class="badge" text-anchor="middle">WORKING FIGURE · REVIEW SCREENING NOT STARTED</text>
<rect x="40" y="120" width="940" height="440" rx="16" class="panel"/>
<text x="64" y="159" class="count" text-anchor="start">A</text>
<text x="105" y="159" class="panel-title" text-anchor="start">Evidence acquisition</text>
<text x="66" y="185" class="panel-sub" text-anchor="start">PubMed-only snapshot; manual database exports are still absent</text>
<rect x="75" y="210" width="250" height="100" rx="12" class="blue"/>
<text x="95" y="246" class="count" text-anchor="start">61,009</text>
<text x="95" y="277" class="card-title" text-anchor="start">records identified in PubMed</text>
<text x="95" y="298" class="small" text-anchor="start">311 XML files · 3 saved searches</text>
<path d="M336,260 L385,260" class="arrow"/>
<rect x="400" y="210" width="225" height="100" rx="12" class="gray"/>
<text x="420" y="246" class="count" text-anchor="start">4,892</text>
<text x="420" y="277" class="card-title" text-anchor="start">duplicates linked</text>
<text x="420" y="298" class="small" text-anchor="start">audit trail retained</text>
<path d="M636,260 L685,260" class="arrow"/>
<rect x="700" y="210" width="230" height="100" rx="12" class="teal"/>
<text x="720" y="246" class="count" text-anchor="start">56,117</text>
<text x="720" y="277" class="card-title" text-anchor="start">unique records queued</text>
<text x="720" y="298" class="small" text-anchor="start">title / abstract screen pending</text>
<rect x="75" y="342" width="405" height="122" rx="12" class="amber"/>
<text x="96" y="374" class="count-amber" text-anchor="start">0 records</text>
<text x="96" y="401" class="card-title" text-anchor="start">Embase · Scopus · Web of Science · PsycINFO</text>
<text x="96" y="428" class="small"><tspan x="96" dy="0">Licensed searches/exports not supplied; this is</tspan><tspan x="96" dy="19">not a complete systematic search.</tspan></text>
<rect x="505" y="342" width="425" height="122" rx="12" class="gray"/>
<text x="528" y="376" class="card-title" text-anchor="start">0 screened · 0 assessed · 0 included</text>
<text x="528" y="407" class="small"><tspan x="528" dy="0">The current deduplicated PubMed queue is ready for</tspan><tspan x="528" dy="19">screening. Screening and eligibility counts remain</tspan><tspan x="528" dy="19">pending.</tspan></text>
<text x="76" y="510" class="small" text-anchor="start">Counts are a reconciliation of retained XML and deduplicated records, not completed screening outcomes.</text>
<rect x="1000" y="120" width="960" height="440" rx="16" class="panel"/>
<text x="1024" y="159" class="count" text-anchor="start">B</text>
<text x="1065" y="159" class="panel-title" text-anchor="start">Study design and analysis sequence</text>
<text x="1026" y="185" class="panel-sub" text-anchor="start">Distinct families are kept separate; correlations are not causal effects</text>
<rect x="1035" y="205" width="275" height="110" rx="12" class="blue"/>
<text x="1055" y="236" class="card-title" text-anchor="start">PRIMARY · FI</text>
<text x="1055" y="263" class="small"><tspan x="1055" dy="0">12 sleep × FI pairs;</tspan><tspan x="1055" dy="19">frozen-atlas reuse; 9/12</tspan><tspan x="1055" dy="19">inherited all-396 BH q≤0.05.</tspan></text>
<rect x="1340" y="205" width="275" height="110" rx="12" class="teal"/>
<text x="1360" y="236" class="card-title" text-anchor="start">SECONDARY · LATENT FACTORS</text>
<text x="1360" y="263" class="small"><tspan x="1360" dy="0">12 × 7 = 84 pairs; 48/84 q≤0.05;</tspan><tspan x="1360" dy="19">sensitivity-only; exact overlap</tspan><tspan x="1360" dy="19">unknown.</tspan></text>
<rect x="1645" y="205" width="280" height="110" rx="12" class="gray"/>
<text x="1665" y="236" class="card-title" text-anchor="start">AGING CONTEXT</text>
<text x="1665" y="263" class="small"><tspan x="1665" dy="0">72 read-only pairs; 26/72</tspan><tspan x="1665" dy="19">inherited all-396 q≤0.05; not</tspan><tspan x="1665" dy="19">replication.</tspan></text>
<path d="M1172,326 L1172,356" class="arrow"/>
<path d="M1478,326 L1478,356" class="arrow"/>
<path d="M1785,326 L1785,356" class="arrow"/>
<rect x="1035" y="365" width="890" height="118" rx="12" class="gray"/>
<text x="1058" y="398" class="card-title" text-anchor="start">Independent replication · local sharing · shared loci · fine-mapping · colocalization · QTL/cell context</text>
<text x="1058" y="430" class="small"><tspan x="1058" dy="0">Not completed for frailty. Proceed only after source, overlap, input, and multiplicity gates</tspan><tspan x="1058" dy="20">pass; do not infer mechanisms from global rg.</tspan></text>
<text x="1038" y="518" class="small" text-anchor="start">UK Biobank overlap is expected in 11/12 primary pairs and in latent-family sources; exact intersections remain unknown.</text>
<rect x="40" y="590" width="940" height="770" rx="16" class="panel"/>
<text x="64" y="629" class="count" text-anchor="start">C</text>
<text x="105" y="629" class="panel-title" text-anchor="start">Locked sleep and circadian panel</text>
<text x="66" y="655" class="panel-sub" text-anchor="start">12 registered phenotypes; groups organize measures without treating them as interchangeable</text>
<rect x="75" y="680" width="870" height="144" rx="12" class="card"/>
<text x="100" y="711" class="card-title" text-anchor="start">Self-reported symptoms and behavior</text>
<text x="100" y="745" class="body"><tspan x="100" dy="0">Insomnia · Daytime sleepiness · Daytime napping · Habitual snoring</tspan></text>
<text x="100" y="804" class="small" text-anchor="start">Panel IDs: insomnia, sleepiness, napping, snoring</text>
<rect x="75" y="837" width="870" height="144" rx="12" class="card"/>
<text x="100" y="868" class="card-title" text-anchor="start">Duration and chronotype</text>
<text x="100" y="902" class="body"><tspan x="100" dy="0">Sleep duration (continuous) · Short sleep (&lt;7 h) · Long sleep (≥9 h) ·</tspan><tspan x="100" dy="24">Chronotype / morningness</tspan></text>
<text x="100" y="961" class="small" text-anchor="start">Panel IDs: sleepdur, shortsleep, longsleep, chronotype</text>
<rect x="75" y="994" width="870" height="125" rx="12" class="card"/>
<text x="100" y="1025" class="card-title" text-anchor="start">Clinical record phenotype</text>
<text x="100" y="1059" class="body"><tspan x="100" dy="0">Sleep apnea</tspan></text>
<text x="100" y="1099" class="small" text-anchor="start">Panel IDs: sleep_apnea</text>
<rect x="75" y="1132" width="870" height="144" rx="12" class="card"/>
<text x="100" y="1163" class="card-title" text-anchor="start">Actigraphy-derived measures</text>
<text x="100" y="1197" class="body"><tspan x="100" dy="0">Sleep efficiency · Sleep duration · Sleep timing</tspan></text>
<text x="100" y="1256" class="small" text-anchor="start">Panel IDs: sleep_efficiency, accel_sleep_duration, sleep_timing</text>
<text x="76" y="1328" class="small" text-anchor="start">Panel taxonomy follows the locked atlas-v1.0 source registry.</text>
<rect x="1000" y="590" width="960" height="770" rx="16" class="panel"/>
<text x="1024" y="629" class="count" text-anchor="start">D</text>
<text x="1065" y="629" class="panel-title" text-anchor="start">Frailty definitions and evidence status</text>
<text x="1026" y="655" class="panel-sub" text-anchor="start">The constructs overlap but are not interchangeable</text>
<rect x="1035" y="680" width="890" height="116" rx="12" class="blue"/>
<text x="1060" y="711" class="card-title" text-anchor="start">Frailty Index · primary</text>
<text x="1060" y="741" class="small"><tspan x="1060" dy="0">Deficit-accumulation measure; current central endpoint. 12 frozen-atlas sleep comparisons are</tspan><tspan x="1060" dy="20">available.</tspan></text>
<rect x="1035" y="808" width="890" height="116" rx="12" class="teal"/>
<text x="1060" y="839" class="card-title" text-anchor="start">Latent factors · secondary sensitivity</text>
<text x="1060" y="869" class="small"><tspan x="1060" dy="0">General frailty plus six specific factors; based on 30 deficits. UK Biobank cohort membership is</tspan><tspan x="1060" dy="20">reported; exact overlap is unknown.</tspan></text>
<rect x="1035" y="936" width="890" height="116" rx="12" class="amber"/>
<text x="1060" y="967" class="card-title" text-anchor="start">Fried phenotype · construct replication</text>
<text x="1060" y="997" class="small"><tspan x="1060" dy="0">Distinct physical phenotype. Exact full summary statistics are not acquired; no sleep-pair</tspan><tspan x="1060" dy="20">estimate is available.</tspan></text>
<rect x="1035" y="1064" width="890" height="116" rx="12" class="amber"/>
<text x="1060" y="1095" class="card-title" text-anchor="start">Hospital Frailty Risk Score</text>
<text x="1060" y="1125" class="small"><tspan x="1060" dy="0">Continuous weighted 109-code EHR score. Publisher hit tables are available; full summary</tspan><tspan x="1060" dy="20">statistics and the exact custom endpoint file remain unverified.</tspan></text>
<rect x="1035" y="1192" width="890" height="116" rx="12" class="amber"/>
<text x="1060" y="1223" class="card-title" text-anchor="start">Five physical frailty components</text>
<text x="1060" y="1253" class="small"><tspan x="1060" dy="0">Weight loss, exhaustion, low activity, slow walking, low grip. Deposited GWAS</tspan><tspan x="1060" dy="20">build/effect/provenance remain unresolved; not harmonized.</tspan></text>
<text x="1037" y="1338" class="small" text-anchor="start">No eligible physical-component, Fried, or HFRS sleep analysis is represented here.</text>
<rect x="40" y="1390" width="1920" height="66" rx="12" class="gray"/>
<text x="65" y="1418" class="card-title" text-anchor="start">INTERPRETATION</text>
<text x="225" y="1418" class="small" text-anchor="start">Genome-wide genetic correlation describes shared effects; it does not establish causation, independent replication, local sharing, or mechanism.</text>
<text x="225" y="1440" class="small" text-anchor="start">Figure 1 remains provisional until licensed searches, dual screening, eligibility assessment, and the reporting flow are complete.</text>
</svg>
