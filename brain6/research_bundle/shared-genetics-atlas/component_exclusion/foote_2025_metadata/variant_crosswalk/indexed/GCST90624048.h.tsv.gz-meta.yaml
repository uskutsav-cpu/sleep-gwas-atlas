analysis_software: Genomic SEM
author_notes: "Multivariate GWAS summary statistics for Factor 2 in the latent model\
  \ of frailty reported in Foote et al. (2025) Uncovering the multivariate genetic\
  \ architecture of frailty with genomic structural equation modelling, in press at\
  \ Nature Genetics (Preprint available: https://doi.org/10.1101/2024.07.24.24310923).\
  \ These sumstats represent frailty pathways shared between frailty deficits linked\
  \ to Unhealthy Lifestyle. \n\nColumns: chromosome; base_pair_location (build 37/hg19);\
  \ effect_allele; other_allele (non-effect allele); beta; standard_error; effect_allele_frequency;\
  \ p_value; rs_id; n (this corresponds to the expected N (Nhat) for the latent factor);\
  \ Q_metric (the factor-specific, chi-square distributed heterogeneity index value);\
  \ Q_metric_pvalue (the p-value of the heterogeneity statistic \u2013 these results\
  \ were filtered to remove significant Q signal i.e. Q p-value <7.14e-09)"
