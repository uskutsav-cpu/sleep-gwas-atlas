# Study meta-data
gwas_id: GCST90624053
author_notes: "GWAS summary statistics for a meta-analysis of pneumonia cases and
  healthy controls from PanUKB and FinnGen release 10 as reported in Foote et al.
  (2025) Uncovering the multivariate genetic architecture of frailty with genomic
  structural equation modelling, in press at Nature Genetics (Preprint available:
  https://doi.org/10.1101/2024.07.24.24310923). Total sample size was 832,234 individuals
  (77,431 pneumonia cases and 754,803 healthy controls). \n\nColumns: chromosome;
  base_pair_location (build 37/hg19); effect_allele; other_allele (non-effect allele);
  beta; standard_error; effect_allele_frequency; p_value; rs_id; n (total number of
  cases and controls in sample)"
gwas_catalog_api: https://www.ebi.ac.uk/gwas/rest/api/studies/GCST90624053
date_metadata_last_modified: 2025-08-21

