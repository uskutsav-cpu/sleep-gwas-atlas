# Study meta-data
gwas_id: GCST90824105
author_notes: Genome-wide association study of accelerometer-derived sleep efficiency
  in 80,013 European ancestry participants from UK Biobank. Sleep traits were derived
  using a self-supervised deep learning model trained on polysomnography data to classify
  REM and NREM sleep from wrist-worn accelerometer recordings. Association analyses
  were performed using REGENIE under an additive linear mixed model, adjusted for
  age at accelerometry, sex, study centre, season of wear, genotyping array, and 10
  principal components. Variants with MAF < 0.01 or imputation INFO < 0.3 were excluded.
  Genome build GRCh37.
