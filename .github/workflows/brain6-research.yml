name: Brain6 research snapshot

on:
  push:
    paths:
      - 'brain6/research_bundle/**'
      - 'brain6/research_prototypes/**'
      - 'brain6/alphagenome_pilot/**'
      - '.github/workflows/brain6-research.yml'
  pull_request:
    paths:
      - 'brain6/research_bundle/**'
      - 'brain6/research_prototypes/**'
      - 'brain6/alphagenome_pilot/**'
      - '.github/workflows/brain6-research.yml'

permissions:
  contents: read

jobs:
  portable-research-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - run: python -m pip install numpy==1.26.4
      - name: Verify distributed file identities and report navigation
        run: |
          python brain6/research_bundle/shared-genetics-atlas/bundle_integrity.py
          python brain6/research_bundle/shared-genetics-atlas/verify_local_links.py
      - name: Check the ML computation against saved numerical fixtures
        run: python -m unittest discover -s brain6/research_prototypes/frailty_prediction -p test_predict.py -v
      - name: Verify all 425 retained AlphaGenome prediction windows
        run: python brain6/alphagenome_pilot/test_expanded.py
