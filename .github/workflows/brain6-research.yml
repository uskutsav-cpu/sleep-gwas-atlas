name: Brain6 research numerical validation
on:
  push:
    paths:
      - 'brain6/translational_psychiatry_research_v1/**'
      - '.github/workflows/brain6-research.yml'
  pull_request:
    paths:
      - 'brain6/translational_psychiatry_research_v1/**'
      - '.github/workflows/brain6-research.yml'
permissions:
  contents: read
jobs:
  numerical-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.4.3 scipy==1.18.1 pandas==3.0.5 pytest==9.1.1
      - name: Source-free mathematical and regression checks
        run: python -m pytest -q -c brain6/translational_psychiatry_research_v1/research_v1/statistics/pytest.ini -m 'not integration' brain6/translational_psychiatry_research_v1/tests brain6/translational_psychiatry_research_v1/research_v1/statistics/test_statistics.py brain6/translational_psychiatry_research_v1/research_v1/statistics/test_parent_review.py brain6/translational_psychiatry_research_v1/research_v1/ld/test_ld_research.py
      - name: Verify inherited tracked scientific artifacts
        run: python brain6/translational_psychiatry_research_v1/scripts/verify_historical_integrity.py
      - name: Replay inherited-table contrasts and molecular posterior checks
        run: python brain6/translational_psychiatry_research_v1/scripts/validate_isolated_replay.py
      - name: State the native integration boundary
        run: echo 'This job does not run native GWAS/LD/SuSiE analyses or certify scientific inference. See exact local integration logs and data access holds.'
      - name: Validate derived numerical claims and source bindings
        run: python brain6/translational_psychiatry_research_v1/scripts/validate_research_package.py
