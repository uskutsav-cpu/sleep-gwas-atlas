name: pipeline-contracts

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.11"
          cache: pip
      - name: Install pinned pipeline and workflow dependencies
        run: pip install -r requirements-pipeline.txt -r requirements-workflow.txt
      - name: Compile Python entry points
        run: python -m py_compile scripts/*.py
      - name: Run source-free manifest and contamination contracts
        run: python brain6/confirmatory_v2/scripts/run_contract_tests.py --suite source-free
      - name: Record archived-data integration requirements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-partition
          path: brain6/confirmatory_v2/qc/contract_test_partition.json
      - name: Check shell entry points
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Validate locked panel and declared sources
        run: |
          python scripts/00_validate_panel.py
          python scripts/10_phase0_audit.py --strict --out results/_smoketest/trait_readiness.tsv
          python scripts/99_atlas_acceptance.py --report-only
      - name: Dry-run the manifest workflow
        run: >-
          snakemake --dry-run --cores 1 --shared-fs-usage
          input-output persistence software-deployment software-deployment-cache
          sources storage-local-copies
      - name: Run synthetic end-to-end smoke test
        run: PYTHON_BIN=python bash scripts/run_smoke_test.sh
