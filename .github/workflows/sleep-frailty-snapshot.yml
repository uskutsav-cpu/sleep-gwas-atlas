name: Sleep-Frailty evidence snapshot

on:
  push:
    paths:
      - 'frailty_paper/research/2026-11-09-public-data-and-ml/**'
      - '.github/workflows/sleep-frailty-snapshot.yml'
  pull_request:
    paths:
      - 'frailty_paper/research/2026-11-09-public-data-and-ml/**'
      - '.github/workflows/sleep-frailty-snapshot.yml'

permissions:
  contents: read

jobs:
  saved-evidence-replay:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SNAPSHOT: frailty_paper/research/2026-11-09-public-data-and-ml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.11'
      - name: Install only the portable replay dependency
        run: python -m pip install -r "$SNAPSHOT/requirements-snapshot.txt"
      - name: Verify distributed files and independently replay saved effect metrics
        run: python "$SNAPSHOT/verify_snapshot.py" --replay-native
